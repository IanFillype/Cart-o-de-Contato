<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contact-card">
        <div class="card-header"></div>
        <img src="https://wallpapers.com/images/hd/cartoon-profile-pictures-iyejcykkj8b7bzad.jpg" alt="Ana Silva" class="profile-pic">
        <div class="card-body">
            <h1 class="card-name">Ana Silva</h1>
            <p class="card-role">Desenvolvedora Web Full Stack</p>
            
            <div class="info-box">
                <div class="info-row">
                    <span class="info-label">EMAIL:</span>
                    <span class="info-value">ana.silva@email.com</span>
                </div>
                <div class="info-row">
                    <span class="info-label">TELEFONE:</span>
                    <span class="info-value">(11) 99999-8888</span>
                </div>
                <div class="info-row">
                    <span class="info-label">LOCALIZAÇÃO:</span>
                    <span class="info-value">São Paulo, SP</span>
                </div>
                <div class="info-row">
                    <span class="info-label">ESPECIALIDADE:</span>
                    <span class="info-value">React, Node.js, CSS</span>
                </div>
            </div>

            <div class="social-buttons">
                <button class="btn-social">LinkedIn</button>
                <button class="btn-social">GitHub</button>
                <button class="btn-social">Portfólio</button>
            </div>

            <button class="btn-contact">ENTRE EM CONTATO</button>
        </div>
        <div class="card-footer">
            Disponível para novos projetos
        </div>
    </div>

</body>
</html>
